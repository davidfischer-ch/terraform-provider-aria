# Visit https://golangci-lint.run/ for usage documentation
# and information on other useful linters
run:
  # FIXME Bump this once a 1.26-built release of golangci-lint ships.
  go: '1.24'

issues:
  max-per-linter: 0
  max-same-issues: 0

linters:
  disable-all: true
  enable:
    - copyloopvar
    - durationcheck
    - errcheck
    - forcetypeassert
    - godot
    - gofmt
    - gosimple
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usetesting
